<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#8B5CF6" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#8B5CF6" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#EC4899" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#EC4899" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#F59E0B" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#8B5CF6" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- Incident Response Cards & D20 Motif -->
    <!-- Card 1: Angled Left (Threat Vector) -->
    <rect x="160" y="165" width="90" height="135" rx="8" transform="rotate(-15 205 232)" 
          fill="#0B0F19" stroke="#EC4899" stroke-width="4" />
    <!-- Card 2: Angled Right (Procedure Defense) -->
    <rect x="262" y="165" width="90" height="135" rx="8" transform="rotate(15 307 232)" 
          fill="#0B0F19" stroke="#8B5CF6" stroke-width="4" />
    <!-- Card 2 Shield Emblem -->
    <path d="M 307 195 L 325 205 V 225 C 325 240 307 252 307 252 C 307 252 289 240 289 225 V 205 Z" 
          fill="#8B5CF6" opacity="0.6" />
    <!-- Center D20 Die Facet -->
    <polygon points="256,200 294,222 294,268 256,290 218,268 218,222" fill="#0F172A" stroke="#F59E0B" stroke-width="4" />
    <!-- D20 Internal Triangle -->
    <polygon points="256,215 282,260 230,260" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
    <line x1="256" y1="200" x2="256" y2="215" stroke="#F59E0B" stroke-width="2" />
    <line x1="294" y1="222" x2="282" y2="260" stroke="#F59E0B" stroke-width="2" />
    <line x1="218" y1="222" x2="230" y2="260" stroke="#F59E0B" stroke-width="2" />
    <circle cx="256" cy="245" r="5" fill="#FFFFFF" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#8B5CF6" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • DISCORD BOT</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">BACKDOORS &amp; BREACHES DISCORD BOT</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Interactive Incident Response Tabletop Simulator &amp; Card Game Bot for Discord</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: Incident Response -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="201" height="38" rx="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#8B5CF6" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Incident Response</text>
      </g>
      <!-- Chip 2: B&amp;B Tabletop -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="156" height="38" rx="8" fill="#111827" stroke="#EC4899" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#EC4899" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">B&amp;B Tabletop</text>
      </g>
      <!-- Chip 3: 571 Cards Indexed -->
      <g transform="translate(385, 0)">
        <rect x="0" y="0" width="201" height="38" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#F59E0B" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">571 Cards Indexed</text>
      </g>
      <!-- Chip 4: Dockerized -->
      <g transform="translate(600, 0)">
        <rect x="0" y="0" width="140" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dockerized</text>
      </g>
    </g>
  </g>
</svg>
