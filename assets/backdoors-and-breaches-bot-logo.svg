<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#8B5CF6" />
    <circle cx="256" cy="71" r="5" fill="#8B5CF6" />
    <circle cx="441" cy="256" r="14" stroke="#EC4899" />
    <circle cx="441" cy="256" r="5" fill="#EC4899" />
    <circle cx="256" cy="441" r="14" stroke="#F59E0B" />
    <circle cx="256" cy="441" r="5" fill="#F59E0B" />
    <circle cx="71" cy="256" r="14" stroke="#8B5CF6" />
    <circle cx="71" cy="256" r="5" fill="#8B5CF6" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Incident Response Cards & D20 Motif -->
    <!-- Card 1: Angled Left (Threat Vector) -->
    <rect x="160" y="165" width="90" height="135" rx="8" transform="rotate(-15 205 232)" 
          fill="#0B0F19" stroke="#EC4899" stroke-width="4" />
    <!-- Card 2: Angled Right (Procedure Defense) -->
    <rect x="262" y="165" width="90" height="135" rx="8" transform="rotate(15 307 232)" 
          fill="#0B0F19" stroke="#8B5CF6" stroke-width="4" />
    <!-- Card 2 Shield Emblem -->
    <path d="M 307 195 L 325 205 V 225 C 325 240 307 252 307 252 C 307 252 289 240 289 225 V 205 Z" 
          fill="#8B5CF6" opacity="0.6" />
    <!-- Center D20 Die Facet -->
    <polygon points="256,200 294,222 294,268 256,290 218,268 218,222" fill="#0F172A" stroke="#F59E0B" stroke-width="4" />
    <!-- D20 Internal Triangle -->
    <polygon points="256,215 282,260 230,260" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
    <line x1="256" y1="200" x2="256" y2="215" stroke="#F59E0B" stroke-width="2" />
    <line x1="294" y1="222" x2="282" y2="260" stroke="#F59E0B" stroke-width="2" />
    <line x1="218" y1="222" x2="230" y2="260" stroke="#F59E0B" stroke-width="2" />
    <circle cx="256" cy="245" r="5" fill="#FFFFFF" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#EC4899" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#8B5CF6" filter="url(#glow)" />
</svg>
