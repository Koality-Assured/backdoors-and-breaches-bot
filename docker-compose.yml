version: "3.8"

services:
  bnb-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/koality-assured/backdoors-and-breaches-bot:latest
    container_name: bnb-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - COMMAND_PREFIX=${COMMAND_PREFIX:-!}
      - DEFAULT_DECK=${DEFAULT_DECK:-CoreV2.2}
      - MAX_TURNS=${MAX_TURNS:-10}
      - INJECT_FAILURE_THRESHOLD=${INJECT_FAILURE_THRESHOLD:-3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Optional: mount custom decks or local overrides
      - ./decks:/app/decks:ro
